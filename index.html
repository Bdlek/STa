<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cetus Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #05050a;
      --bg2: #0c0c14;
      --bg3: #14142a;
      --card: rgba(18,18,40,0.85);
      --border: rgba(255,255,255,0.06);
      --border-glow: rgba(0,229,255,0.15);
      --text: #e8e8f0;
      --text2: #7878a0;
      --text3: #505070;
      --accent: #00e5ff;
      --accent2: #7c4dff;
      --accent3: #00b8d4;
      --gold: #ffd740;
      --gold2: #ffab00;
      --green: #00e676;
      --red: #ff1744;
      --orange: #ff9100;
      --pink: #ff4081;
      --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --mono: 'Orbitron', 'SF Mono', monospace;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .panel {
      width: 100%;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,229,255,0.03) 0%, transparent 60%);
    }

    /* ═══ Header ═══ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(0,229,255,0.06) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .team-logo {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--bg3);
      border: 2px solid var(--border-glow);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(0,229,255,0.15), inset 0 0 20px rgba(0,229,255,0.05);
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .team-logo:hover { border-color: var(--accent); box-shadow: 0 0 30px rgba(0,229,255,0.3); }
    .team-logo:empty { display: none; }
    .team-logo img { width: 100%; height: 100%; object-fit: contain; }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(0,229,255,0.3);
      position: relative;
    }
    .avatar::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1px solid rgba(0,229,255,0.3);
    }
    .header-info { display: flex; flex-direction: column; gap: 2px; }
    .name {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 11px;
      color: var(--text2);
      font-family: var(--mono);
      letter-spacing: 1px;
    }
    .header-right { display: flex; gap: 8px; }
    .stat-pill {
      background: rgba(20,20,42,0.8);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-family: var(--mono);
      font-weight: 600;
      display: flex; align-items: center; gap: 5px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .stat-pill:hover { border-color: var(--border-glow); }
    .stat-label { color: var(--gold); }
    .stat-pill.street { color: var(--accent); }

    /* ═══ Tabs ═══ */
    .tabs {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      position: relative;
    }
    .tab:hover { color: var(--text2); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
      box-shadow: 0 0 8px var(--accent);
    }

    /* ═══ Content ═══ */
    .content { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .pnl { display: none; padding: 14px 16px; animation: fadeIn 0.3s ease; }
    .pnl.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* ═══ Cards ═══ */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    }
    .card:hover { border-color: rgba(255,255,255,0.1); }
    .card-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-title::before {
      content: '';
      width: 3px;
      height: 10px;
      background: var(--accent);
      border-radius: 2px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
    }
    .card-row .label { color: var(--text2); font-size: 12px; }
    .card-row .value { font-weight: 600; font-family: var(--mono); font-size: 12px; letter-spacing: 0.5px; }
    .card-row .value.accent { color: var(--accent); }
    .card-row .value.gold { color: var(--gold); }
    .card-row .value.green { color: var(--green); }
    .card-row .value.red { color: var(--red); }

    /* ═══ Grid ═══ */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* ═══ Progress Bar ═══ */
    .bar-wrap { margin-top: 8px; }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .bar-label span:last-child { font-family: var(--mono); font-weight: 600; }
    .bar-track {
      height: 5px;
      background: rgba(255,255,255,0.04);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .bar-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 20px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
      border-radius: 0 3px 3px 0;
    }
    .bar-fill.gold { background: linear-gradient(90deg, #5d4200, var(--gold)); }
    .bar-fill.green { background: linear-gradient(90deg, #003d29, var(--green)); }
    .bar-fill.pink { background: linear-gradient(90deg, #4a0028, var(--pink)); }
    .bar-fill.orange { background: linear-gradient(90deg, #4a2600, var(--orange)); }
    .bar-fill.red { background: linear-gradient(90deg, #4a0012, var(--red)); }
    .bar-fill.accent { background: linear-gradient(90deg, #003d4a, var(--accent)); }

    /* ═══ Chip ═══ */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text2);
      transition: all 0.2s ease;
    }
    .chip:hover { background: rgba(255,255,255,0.08); }
    .chip.accent { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.2); color: var(--accent); }
    .chip.gold { background: rgba(255,215,64,0.08); border-color: rgba(255,215,64,0.2); color: var(--gold); }
    .chip.green { background: rgba(0,230,118,0.08); border-color: rgba(0,230,118,0.2); color: var(--green); }
    .chip.pink { background: rgba(255,64,129,0.08); border-color: rgba(255,64,129,0.2); color: var(--pink); }
    .chip.orange { background: rgba(255,145,0,0.08); border-color: rgba(255,145,0,0.2); color: var(--orange); }

    /* ═══ Radar ═══ */
    .radar-wrap { display: flex; justify-content: center; padding: 12px 0; }

    /* ═══ NPC Card ═══ */
    .npc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(12px);
    }
    .npc-card:hover { border-color: rgba(0,229,255,0.2); transform: translateY(-1px); }
    .npc-header { display: flex; align-items: center; gap: 10px; }
    .npc-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--bg3), rgba(0,229,255,0.1));
      border: 1px solid var(--border-glow);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .npc-name { font-weight: 700; font-size: 13px; }
    .npc-sub { font-size: 10px; color: var(--text2); margin-top: 1px; }
    .npc-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .npc-detail {
      display: none; margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .npc-card.open .npc-detail { display: block; }

    /* ═══ Item ═══ */
    .item-tile {
      background: rgba(20,20,42,0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .item-tile:hover { border-color: var(--border-glow); }
    .item-name { font-size: 11px; font-weight: 600; margin-bottom: 2px; }
    .item-desc { font-size: 10px; color: var(--text2); line-height: 1.3; }

    /* ═══ Team Badge ═══ */
    .team-badge-card {
      background: linear-gradient(135deg, rgba(0,229,255,0.06) 0%, var(--card) 100%);
      border: 1px solid rgba(0,229,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .team-badge-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0,229,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .team-badge-logo {
      width: 56px; height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0,229,255,0.4));
    }

    /* ═══ Schedule ═══ */
    .sched-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(20,20,42,0.5);
      margin-bottom: 6px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .sched-item:hover { border-color: var(--border-glow); }
    .sched-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
    .sched-dot.train { background: var(--accent); color: var(--accent); }
    .sched-dot.game { background: var(--red); color: var(--red); }
    .sched-dot.rest { background: var(--green); color: var(--green); }
    .sched-dot.event { background: var(--orange); color: var(--orange); }
    .sched-info { flex: 1; }
    .sched-type { font-size: 12px; font-weight: 600; }
    .sched-detail { font-size: 10px; color: var(--text2); margin-top: 1px; }
    .sched-date { font-size: 10px; color: var(--text3); font-family: var(--mono); flex-shrink: 0; }

    /* ═══ Contract ═══ */
    .contract-card {
      background: rgba(20,20,42,0.6);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    .contract-card:hover { border-color: rgba(255,215,64,0.2); }
    .contract-brand {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }
    .contract-brand .brand-logo {
      height: 22px; width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.85;
    }
    .contract-meta {
      display: flex; justify-content: space-between;
      margin-top: 8px; font-size: 11px; color: var(--text2);
    }
    .contract-amount {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 800;
      color: var(--gold);
      margin-top: 6px;
      text-shadow: 0 0 20px rgba(255,215,64,0.3);
    }

    /* ═══ Review ═══ */
    .review-card {
      background: rgba(20,20,42,0.5);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 12px;
      margin-bottom: 8px;
    }
    .review-source {
      font-size: 9px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .review-score {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 800;
      color: var(--gold);
    }
    .review-text { font-size: 12px; color: var(--text); margin-top: 6px; line-height: 1.5; }

    /* ═══ Empty ═══ */
    .empty {
      text-align: center;
      color: var(--text3);
      padding: 40px 20px;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    /* ═══ Scrollbar ═══ */
    .content::-webkit-scrollbar { width: 3px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    @media (max-width: 360px) {
      .header { padding: 12px; }
      .pnl { padding: 12px; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
      .name { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="header-left">
        <div class="team-logo" id="team-logo"></div>
        <div class="avatar">0</div>
        <div class="header-info">
          <div class="name">Cetus Wilder</div>
          <div class="subtitle">SG / SF · #0</div>
        </div>
      </div>
      <div class="header-right">
        <div class="stat-pill"><span class="stat-label">$</span><span id="h-cash">0</span></div>
        <div class="stat-pill street"><span id="h-street">0</span></div>
      </div>
    </div>
    <div class="tabs" id="tab-bar">
      <button class="tab active" data-t="overview">概览</button>
      <button class="tab" data-t="skills">技能</button>
      <button class="tab" data-t="career">生涯</button>
      <button class="tab" data-t="media">媒体</button>
      <button class="tab" data-t="contacts">人脉</button>
      <button class="tab" data-t="gear">装备</button>
    </div>
    <div class="content">
      <div class="pnl active" id="p-overview"></div>
      <div class="pnl" id="p-skills"></div>
      <div class="pnl" id="p-career"></div>
      <div class="pnl" id="p-media"></div>
      <div class="pnl" id="p-contacts"></div>
      <div class="pnl" id="p-gear"></div>
    </div>
  </div>

<script>
// ═══ Helpers ═══
const g = (o, path, d = '') => {
  if (!o) return d;
  const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  let v = o;
  for (const p of parts) { v = v?.[p]; }
  return (v === null || v === undefined || v === '') ? d : v;
};
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

const repTitles = [
  ['无名之辈','旁观者','无'],
  ['街头混混','候补名单','试训球员'],
  ['小有名气','轮换球员','发展联盟'],
  ['令人畏惧','主力核心','角色球员'],
  ['地下传奇','球队王牌','全明星'],
  ['纽约之王','更衣室之魂','超级巨星'],
];
const relationColor = (stage) => {
  if (stage.includes('恋人') || stage.includes('灵魂')) return 'pink';
  if (stage.includes('暧昧')) return 'orange';
  if (stage.includes('亲近') || stage.includes('青梅')) return 'green';
  if (stage.includes('熟识')) return 'accent';
  return '';
};
const genderIcon = (sex, sg) => {
  if (sg === 'Alpha') return '⚔️';
  if (sg === 'Omega') return '🌸';
  if (sg === 'Beta') return '◈';
  return sex === '女' ? '♀' : '♂';
};

// ═══ NBA 球队 Logo ═══
const TEAM_LOGOS = {

  'MIN': 'https://cdn.nba.com/logos/nba/1610612750/logo.svg',
  'NOP': 'https://cdn.nba.com/logos/nba/1610612740/logo.svg',
  'NYK': 'https://cdn.nba.com/logos/nba/1610612752/logo.svg',
  'OKC': 'https://cdn.nba.com/logos/nba/1610612760/logo.svg',
  'ORL': 'https://cdn.nba.com/logos/nba/1610612753/logo.svg',
  'PHI': 'https://cdn.nba.com/logos/nba/1610612755/logo.svg',
  'PHX': 'https://cdn.nba.com/logos/nba/1610612756/logo.svg',

  'UTA': 'https://cdn.nba.com/logos/nba/1610612762/logo.svg',
  'WAS': 'https://cdn.nba.com/logos/nba/1610612764/logo.svg',
};

// ═══ 品牌 Logo ═══
const BRAND_LOGOS = {

function drawRadar(data) {
  const c = document.getElementById('radar-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  if (!ctx) return;
  const w=c.width, h=c.height, cx=w/2, cy=h/2+5, r=80, n=data.length, step=Math.PI*2/n;
  ctx.clearRect(0,0,w,h);
  for (let ring=1;ring<=4;ring++){
    const rr=r*ring/4;
    ctx.beginPath();
    for(let i=0;i<=n;i++){const a=-Math.PI/2+i*step;i===0?ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;ctx.stroke();
  }
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.stroke();}
  ctx.beginPath();
  data.forEach((d,i)=>{const a=-Math.PI/2+i*step;const rr=r*d.value/100;i===0?ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a)):ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));});
  ctx.closePath();
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(0,229,255,0.25)');grad.addColorStop(1,'rgba(0,229,255,0.05)');
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='#00e5ff';ctx.lineWidth=2;ctx.stroke();
  data.forEach((d,i)=>{
    const a=-Math.PI/2+i*step;const rr=r*d.value/100;
    const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#00e5ff';ctx.fill();
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=6;ctx.fill();ctx.shadowBlur=0;
    const lx=cx+(r+20)*Math.cos(a),ly=cy+(r+20)*Math.sin(a);
    ctx.fillStyle='#7878a0';ctx.font='10px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`${d.label} ${d.value}`,lx,ly);
  });
}

    {label:'体能',value:g(state,'主角.技能.基础体能.体能',0)},
  ]),100);
}

async function init() {
  try{
    await readData();
    renderAll();
    document.querySelectorAll('.tab').forEach(tab=>{
      tab.addEventListener('click',function(){
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('active'));
        this.classList.add('active');
        const t=document.getElementById('p-'+this.dataset.t);if(t)t.classList.add('active');
      });
    });
    let rt=null,ir=false;
    const rf=()=>{if(ir)return;ir=true;clearTimeout(rt);rt=setTimeout(async()=>{await readData();renderAll();ir=false;},500);};
    if(typeof eventOn==='function'){
      eventOn(tavern_events.MESSAGE_UPDATED,rf);
      eventOn(tavern_events.MESSAGE_RECEIVED,()=>setTimeout(rf,1000));
    }
  }catch(e){console.error('Statusbar init error:',e);}
}
$(()=>{errorCatched(init)();});
